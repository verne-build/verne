name: Web Preview

# Label a same-repository PR `preview:web` to deploy an isolated hosted-web
# preview. Each preview uses a deterministic Workers.dev origin and is removed
# when its label is removed or the PR closes.
#
# The build intentionally omits managed relay configuration: previews boot as
# the hosted-static app with manual pairing only. Pair a server into a preview
# with `verne pair --tailscale` (or any reachable HTTPS backend), or paste a
# host + pairing code under Settings → Connections.

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: web-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy web preview
    # Same-repo PRs only: fork PRs do not receive the Cloudflare secrets, and
    # this workflow should skip rather than fail for them. The label remains
    # opt-in: only its addition, new commits, and PR reopen events deploy.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview:web') &&
      (
        github.event.action == 'synchronize' ||
        github.event.action == 'reopened' ||
        (github.event.action == 'labeled' && github.event.label.name == 'preview:web')
      )
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...
              - --filter=@t3tools/web...
              - --filter=@verne-build/cloudflare...

      - id: deploy
        name: Build and deploy preview
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Missing CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi

          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Missing CLOUDFLARE_ACCOUNT_ID." >&2
            exit 1
          fi

          if [[ -z "${CLOUDFLARE_WORKERS_SUBDOMAIN:-}" ]]; then
            echo "Missing CLOUDFLARE_WORKERS_SUBDOMAIN." >&2
            exit 1
          fi

          worker_name="verne-app-pr-${{ github.event.pull_request.number }}"
          deployment_url="https://${worker_name}.${CLOUDFLARE_WORKERS_SUBDOMAIN}.workers.dev"

          export APP_VERSION="0.0.0-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}"
          export VITE_HOSTED_APP_URL="$deployment_url"
          export VITE_HOSTED_APP_CHANNEL="preview"

          vp run --filter @t3tools/web build
          node scripts/apply-web-brand-assets.ts development
          vp run --filter @verne-build/cloudflare deploy:channel --name "$worker_name"

          echo "Deployed $deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Comment deployment URL
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = "<!-- web-preview-deploy -->";
            const body = [
              marker,
              "### Web preview",
              "",
              `${process.env.DEPLOYMENT_URL} (for ${process.env.HEAD_SHA.slice(0, 7)})`,
              "",
              "Pair a server into it with `verne pair --tailscale`, or paste a host + pairing",
              "code under Settings → Connections.",
              "",
              "This Worker is deleted when the `preview:web` label is removed or the PR closes.",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

  cleanup:
    name: Remove web preview
    # Fork PRs never receive Cloudflare secrets. Only PR closure or removal of
    # the opt-in label can remove a same-repository preview Worker.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.action == 'closed' ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'preview:web')
      )
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@verne-build/cloudflare...

      - name: Delete preview Worker
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Missing CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi

          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Missing CLOUDFLARE_ACCOUNT_ID." >&2
            exit 1
          fi

          worker_name="verne-app-pr-${{ github.event.pull_request.number }}"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker_name")"

          case "$status" in
            200)
              vp run --filter @verne-build/cloudflare delete:worker --name "$worker_name"
              ;;
            404)
              echo "Preview Worker $worker_name is already absent."
              ;;
            *)
              echo "Cloudflare Worker lookup failed with HTTP $status." >&2
              exit 1
              ;;
          esac

      - name: Mark preview removed
        uses: actions/github-script@v8
        env:
          WORKER_NAME: verne-app-pr-${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = "<!-- web-preview-deploy -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: [
                  marker,
                  "### Web preview",
                  "",
                  `Preview Worker \`${process.env.WORKER_NAME}\` was removed.`,
                ].join("\n"),
              });
            }

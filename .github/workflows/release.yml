name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (none = rebuild & republish current version)"
        type: choice
        options: [patch, minor, major, none]
        default: patch
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  gate:
    name: Approve & version
    runs-on: ubuntu-latest
    environment: release
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.bump }}" != "none" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            TAG=$(npm version ${{ inputs.bump }} -m "chore(release): %s" | tail -1)
            git push origin "HEAD:${{ github.ref_name }}" --follow-tags
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # bump=none: rebuild & republish the current package.json version, no new tag
            TAG="v$(node -p "require('./package.json').version")"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

  build-mac:
    name: Build macOS ${{ matrix.arch }}
    needs: gate
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x64,   runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "daemon -> daemon/target" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm bundle:install
      - run: cargo build --release --manifest-path daemon/Cargo.toml
      - run: pnpm exec electron-vite build
      - name: Build (signed+notarized when secrets present, unsigned otherwise)
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_B64" ]; then
            echo "$APPLE_API_KEY_B64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never
          else
            echo "::notice::Signing secrets not set — producing unsigned build"
            pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never \
              -c.mac.identity=null
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*-mac.zip
            release/*.blockmap
            release/latest-mac.yml
          retention-days: 14
          if-no-files-found: warn

  build-linux:
    name: Build Linux x64
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "daemon -> daemon/target" }
      - name: Install system deps
        run: |
          sudo apt-get update -y
          # cmake for git2 bundled build; fakeroot+dpkg for .deb packaging
          sudo apt-get install -y cmake pkg-config fakeroot dpkg
      - run: pnpm install --frozen-lockfile
      - run: pnpm bundle:install
      - run: cargo build --release --manifest-path daemon/Cargo.toml
      - run: pnpm exec electron-vite build
      - name: Package (Linux)
        run: pnpm exec electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          retention-days: 14
          if-no-files-found: warn

  build-win:
    name: Build Windows x64
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "daemon -> daemon/target" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm bundle:install
      - run: cargo build --release --manifest-path daemon/Cargo.toml
      - run: pnpm exec electron-vite build
      - name: Package (Windows, unsigned)
        run: pnpm exec electron-builder --win --publish never
        env:
          # Skip code signing — add CSC_LINK / CSC_KEY_PASSWORD secrets when
          # a Windows signing cert is available.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-win-x64
          path: |
            release/*.exe
            release/*.yml
          retention-days: 14
          if-no-files-found: warn

  publish:
    name: Publish release
    needs: [gate, build-mac, build-linux, build-win]
    # Run even if some platform builds failed so available artifacts still publish.
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*
      - name: Merge mac update manifests & collect all artifacts
        env:
          JS_YAML_DIR: ${{ runner.temp }}/tools
        run: |
          mkdir -p out
          # macOS (dmg, zip, blockmap)
          cp artifacts/dist-mac-*/*.dmg artifacts/dist-mac-*/*-mac.zip artifacts/dist-mac-*/*.blockmap out/ 2>/dev/null || true
          # Linux
          cp artifacts/dist-linux-*/*.AppImage artifacts/dist-linux-*/*.deb out/ 2>/dev/null || true
          cp artifacts/dist-linux-*/latest-linux.yml out/ 2>/dev/null || true
          # Windows
          cp artifacts/dist-win-*/*.exe out/ 2>/dev/null || true
          cp artifacts/dist-win-*/latest.yml out/ 2>/dev/null || true
          # Merge macOS latest-mac.yml (arm64 + x64)
          mkdir -p "$JS_YAML_DIR"
          echo '{"name":"tools","private":true}' > "$JS_YAML_DIR/package.json"
          npm install --prefix "$JS_YAML_DIR" --no-audit --no-fund js-yaml
          test -d "$JS_YAML_DIR/node_modules/js-yaml" || { echo "::error::js-yaml not installed"; exit 1; }
          # Merge macOS manifests only if both are present
          ARM64_YML="artifacts/dist-mac-arm64/latest-mac.yml"
          X64_YML="artifacts/dist-mac-x64/latest-mac.yml"
          if [ -f "$ARM64_YML" ] && [ -f "$X64_YML" ]; then
            node scripts/merge-mac-manifests.mjs out/latest-mac.yml "$ARM64_YML" "$X64_YML"
          elif [ -f "$ARM64_YML" ]; then
            cp "$ARM64_YML" out/latest-mac.yml
          elif [ -f "$X64_YML" ]; then
            cp "$X64_YML" out/latest-mac.yml
          fi
          ls -la out
      - name: Generate release notes
        run: |
          TAG="${{ needs.gate.outputs.tag }}"
          PREV=$(git tag -l 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1)
          RANGE=$([ -n "$PREV" ] && echo "$PREV..$TAG" || echo "$TAG")
          { echo "## Changes"; git log --pretty='- %s' "$RANGE"; } > notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.gate.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" out/* --title "$TAG" --notes-file notes.md
          fi

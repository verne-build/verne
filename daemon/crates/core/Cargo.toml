[package]
name = "verne-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "verne_core"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "5"
log = "0.4"
env_logger = "0.11"
# notify backend is platform-specific (see [target] sections below).
ignore = "0.4"
globset = "0.4"
git2 = { version = "0.20", default-features = false }
sha2 = "0.10"
ctrlc = { version = "3", features = ["termination"] }
toml_edit = "0.22"
toml = "0.8"
regex = "1"
fff-search = "0.9"
alacritty_terminal = "0.26.0"

[dev-dependencies]
tempfile = "3"

# ── Platform-specific dependencies ──────────────────────────────────────────

# FSEvents on macOS: one kernel stream, ~0 per-file fds (vs kqueue which opens
# an fd per watched node → EMFILE on a busy repo).
[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
nix = { version = "0.29", features = ["process", "fs", "signal"] }
libc = "0.2"

# inotify on Linux: default backend, no extra feature flag needed.
[target.'cfg(target_os = "linux")'.dependencies]
notify = { version = "7" }
nix = { version = "0.29", features = ["process", "fs", "signal"] }
libc = "0.2"

# ReadDirectoryChangesW on Windows (notify default backend).
[target.'cfg(windows)'.dependencies]
notify = { version = "7" }

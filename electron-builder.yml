appId: build.verne
productName: Verne
directories:
  output: release
  buildResources: build
afterPack: scripts/after-pack.mjs
files:
  - out/**
asarUnpack:
  - "**/node_modules/sherpa-onnx*/**"
  - out/main/mcp-server.cjs
  # pdf.js reads these via fetch()/WebAssembly from the worker — keep them as
  # real files so the file protocol can serve them.
  - out/renderer/pdfjs/**
extraResources:
  - from: resources/bundled
    to: bundled
  - from: resources/notification.wav
    to: notification.wav
  - from: resources/voice.wav
    to: voice.wav
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  entitlements: build/Verne.entitlements
  entitlementsInherit: build/Verne.entitlements
  extendInfo:
    NSMicrophoneUsageDescription: "Verne uses the microphone for voice dictation."
    # Liquid Glass icon catalog (macOS 26). Assets.car copied in via afterPack.
    # icon.icns above stays as the fallback for macOS < 26.
    CFBundleIconName: AppIcon
  # Hardened runtime + Developer ID signing, required for notarization.
  # identity auto-detects the "Developer ID Application" cert in the login
  # keychain. Notarization runs automatically when the APPLE_* credential env
  # vars are set at build time (see SIGNING.md).
  hardenedRuntime: true
  gatekeeperAssess: false
  # The Rust daemon binaries in Resources are signed by electron-builder's bundle
  # walk. If notarization flags them, list them explicitly under `binaries:`.
  extraResources:
    - from: daemon/target/release/verne
      to: verne
    - from: daemon/target/release/verne-sidecar
      to: verne-sidecar
  target:
    - target: dir
    - target: dmg
    - target: zip

linux:
  category: Development
  icon: build/icon.png
  extraResources:
    - from: daemon/target/release/verne
      to: verne
    - from: daemon/target/release/verne-sidecar
      to: verne-sidecar
  target:
    - target: AppImage
    - target: deb

win:
  icon: build/icon.png
  extraResources:
    - from: daemon/target/release/verne.exe
      to: verne.exe
    - from: daemon/target/release/verne-sidecar.exe
      to: verne-sidecar.exe
  target:
    - target: nsis
    - target: portable
  # NSIS installer adds the install dir to PATH so `verne` is available in
  # terminals without the ensure_cli_symlink Unix mechanism.
  nsis:
    oneClick: false
    allowToChangeInstallationDirectory: true
    createDesktopShortcut: true
    createStartMenuShortcut: true

publish:
  provider: github
  owner: verne-build
  repo: verne
  # Public repo — no token at runtime; do NOT set `private: true`.
